<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حکم حرفه‌ای | کاریز طب</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #0f4c22 0%, #06260f 100%);
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .score-board {
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }
        .table-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            gap: 15px;
        }
        .dealer-deck {
            background: #fff;
            color: #000;
            width: 70px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #ccc;
        }
        #lobby-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lobby-box {
            background: #113f1b;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 320px;
            width: 90%;
        }
        .lobby-box h2 {
            color: #ffd700;
            margin-top: 0;
        }
        .btn-game {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: linear-gradient(to bottom, #ffd700, #cca600);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-game:active {
            transform: scale(0.98);
        }
        .player-hand {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            min-height: 120px;
            gap: 5px;
            overflow-x: auto;
        }
        .card {
            width: 55px;
            height: 85px;
            background: #fff;
            color: #333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            flex-shrink: 0;
        }
        .card.red {
            color: #d32f2f;
        }
        .message-box {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid rgba(255,215,0,0.4);
        }
    </style>
</head>
<body>

    <div id="lobby-modal">
        <div class="lobby-box">
            <h2>بازی حکم آنلاین/آفلاین</h2>
            <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">لطفاً حالت بازی را انتخاب کنید:</p>
            <button class="btn-game" onclick="startGame(2)">حکم ۲ نفره (تن‌به‌تن)</button>
            <button class="btn-game" onclick="startGame(4)">حکم ۴ نفره (تیمی)</button>
        </div>
    </div>

    <div class="game-header">
        <div class="score-board">ما: <span id="my-score">۰</span> | حریف: <span id="rival-score">۰</span></div>
        <div id="trump-display" style="font-weight: bold; color: #ffd700;">حکم: نامشخص</div>
    </div>

    <div class="table-center">
        <div class="message-box" id="game-status">لطفاً بازی را شروع کنید</div>
        <div class="dealer-deck">حکم</div>
    </div>

    <div class="player-hand" id="player-cards">
        <!-- کارت‌ها اینجا به صورت پویا بارگذاری می‌شوند -->
    </div>

    <script src="game_engine.js"></script>
    <script>
        let currentGame = null;

        // مدیریت دکمه برگشت گوشی
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function (event) {
            const lobby = document.getElementById('lobby-modal');
            if (lobby.style.display === 'none') {
                if (confirm("آیا می‌خواهید به منوی اصلی برگردید؟")) {
                    lobby.style.display = 'flex';
                }
                history.pushState(null, null, location.href);
            } else {
                if (confirm("می‌خواهید از بازی خارج شوید؟")) {
                    history.back();
                } else {
                    history.pushState(null, null, location.href);
                }
            }
        });

        function startGame(mode) {
            document.getElementById('lobby-modal').style.display = 'none';
            currentGame = new HokmGame(mode);
            currentGame.startInitialDeal();
        }
    </script>
</body>
</html>
