<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حکم حرفه‌ای | کاریز طب</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #0f4c22 0%, #06260f 100%);
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* هدر بازی */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .score-board {
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }
        /* میز وسط */
        .table-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .dealer-deck {
            background: #fff;
            color: #000;
            width: 70px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #ccc;
        }
        /* پنل انتخاب حالت بازی (لابی اولیه) */
        #lobby-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lobby-box {
            background: #113f1b;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 320px;
            width: 90%;
        }
        .lobby-box h2 {
            color: #ffd700;
            margin-top: 0;
        }
        .btn-game {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: linear-gradient(to bottom, #ffd700, #cca600);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-game:active {
            transform: scale(0.98);
        }
        /* بخش دست بازیکن */
        .player-hand {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            min-height: 120px;
            gap: -20px;
        }
        .card {
            width: 60px;
            height: 90px;
            background: #fff;
            color: #333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-15px);
        }
        .card.red {
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <!-- لابی انتخاب حالت بازی -->
    <div id="lobby-modal">
        <div class="lobby-box">
            <h2>بازی حکم آنلاین/آفلاین</h2>
            <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">لطفاً حالت بازی را انتخاب کنید:</p>
            <button class="btn-game" onclick="startGame(2)">حکم ۲ نفره (تن‌به‌تن)</button>
            <button class="btn-game" onclick="startGame(4)">حکم ۴ نفره (تیمی)</button>
        </div>
    </div>

    <!-- هدر بازی -->
    <div class="game-header">
        <div class="score-board">ما: <span id="my-score">۰</span> | حریف: <span id="rival-score">۰</span></div>
        <div id="trump-display" style="font-weight: bold; color: #ffd700;">حکم: نامشخص</div>
    </div>

    <!-- میز وسط بازی -->
    <div class="table-center">
        <div class="dealer-deck">کارتی</div>
    </div>

    <!-- دست کارت‌های بازیکن پایین صفحه -->
    <div class="player-hand" id="player-cards">
        <!-- کارت‌های نمونه گرافیکی -->
        <div class="card red"><span>♥ آس</span><span>♥</span></div>
        <div class="card"><span>♠ شاه</span><span>♠</span></div>
        <div class="card red"><span>♦ بی‌بی</span><span>♦</span></div>
        <div class="card"><span>♣ ۱۰</span><span>♣</span></div>
    </div>

    <script src="game_engine.js"></script>
    <script>
        function startGame(mode) {
            // مخفی کردن لابی و شروع بازی
            document.getElementById('lobby-modal').style.display = 'none';
            const engine = new HokmEngine(mode);
            engine.deck.shuffle();
            alert("بازی در حالت " + mode + " نفره با موفقیت آغاز شد!");
        }
    </script>
</body>
</html>
