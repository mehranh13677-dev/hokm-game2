<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخته نرد حرفه‌ای - آنلاین و آفلاین</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.4rem;
            color: #f39c12;
        }
        .status-bar {
            margin-bottom: 10px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .game-container {
            width: 95%;
            max-width: 680px;
            background: #8e44ad;
            border: 8px solid #4a235a;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 8px;
            position: relative;
        }
        .board-row {
            display: flex;
            justify-content: space-between;
            height: 200px;
        }
        .quadrant {
            display: flex;
            width: 44%;
            justify-content: space-around;
            background: #d7bde2;
            border: 2px solid #5b2c6f;
            padding: 0 2px;
        }
        .bar {
            width: 8%;
            background: #5b2c6f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }
        .point {
            width: 14.28%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .point.top::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 130px solid #273746;
            pointer-events: none;
        }
        .point.top.alt::after {
            border-top-color: #ecf0f1;
        }
        .point.bottom::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 130px solid #273746;
            pointer-events: none;
        }
        .point.bottom.alt::after {
            border-bottom-color: #ecf0f1;
        }
        .checker {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }
        .checker.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #bdc3c7);
            color: #2c3e50;
            border: 1px solid #7f8c8d;
        }
        .checker.black {
            background: radial-gradient(circle at 30% 30%, #515a5a, #17202a);
            color: #fff;
            border: 1px solid #000;
        }
        .point.top .checker { top: 4px; }
        .point.bottom .checker { bottom: 4px; }

        .dice-panel {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .dice {
            width: 40px;
            height: 40px;
            background: #fff;
            color: #333;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button {
            padding: 8px 16px;
            background: #f39c12;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #d68910;
        }
        button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>تخته نرد حرفه‌ای</h1>
    <div class="status-bar" id="status">نوبت شماست - تاس بیندازید</div>
    
    <div class="game-container" id="board">
        <div class="board-row">
            <div class="quadrant">
                <div class="point top alt" data-index="11"></div>
                <div class="point top" data-index="10"></div>
                <div class="point top alt" data-index="9"></div>
                <div class="point top" data-index="8"></div>
                <div class="point top alt" data-index="7"></div>
                <div class="point top" data-index="6"></div>
            </div>
            <div class="bar"></div>
            <div class="quadrant">
                <div class="point top alt" data-index="5"></div>
                <div class="point top" data-index="4"></div>
                <div class="point top alt" data-index="3"></div>
                <div class="point top" data-index="2"></div>
                <div class="point top alt" data-index="1"></div>
                <div class="point top" data-index="0"></div>
            </div>
        </div>

        <div class="board-row" style="margin-top: 10px;">
            <div class="quadrant">
                <div class="point bottom" data-index="12"></div>
                <div class="point bottom alt" data-index="13"></div>
                <div class="point bottom" data-index="14"></div>
                <div class="point bottom alt" data-index="15"></div>
                <div class="point bottom" data-index="16"></div>
                <div class="point bottom alt" data-index="17"></div>
            </div>
            <div class="bar"></div>
            <div class="quadrant">
                <div class="point bottom" data-index="18"></div>
                <div class="point bottom alt" data-index="19"></div>
                <div class="point bottom" data-index="20"></div>
                <div class="point bottom alt" data-index="21"></div>
                <div class="point bottom" data-index="22"></div>
                <div class="point bottom alt" data-index="23"></div>
            </div>
        </div>
    </div>

    <div class="dice-panel">
        <button id="roll-btn" onclick="rollDice()">انداختن تاس</button>
        <div class="dice" id="dice1">-</div>
        <div class="dice" id="dice2">-</div>
    </div>

    <script>
        let boardState = {
            0: {color: 'B', count: 2},
            5: {color: 'W', count: 5},
            7: {color: 'W', count: 3},
            11: {color: 'B', count: 5},
            12: {color: 'W', count: 5},
            16: {color: 'B', count: 3},
            18: {color: 'B', count: 5},
            23: {color: 'W', count: 2}
        };

        let selectedPoint = null;
        let currentTurn = 'W'; // W مخفف سفید (شما)، B مخفف سیاه (ربات)
        let diceRolled = false;

        function renderBoard() {
            document.querySelectorAll('.point').forEach(p => {
                let existingPoint = p.getAttribute('data-index');
                p.innerHTML = '';
                
                if (boardState[existingPoint] && boardState[existingPoint].count > 0) {
                    let data = boardState[existingPoint];
                    for (let i = 0; i < data.count; i++) {
                        let checker = document.createElement('div');
                        checker.className = `checker ${data.color === 'W' ? 'white' : 'black'}`;
                        if (p.classList.contains('top')) {
                            checker.style.top = (i * 18) + 'px';
                        } else {
                            checker.style.bottom = (i * 18) + 'px';
                        }
                        p.appendChild(checker);
                    }
                }
            });
        }

        function rollDice() {
            if (diceRolled || currentTurn !== 'W') return;

            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice1').innerText = d1;
            document.getElementById('dice2').innerText = d2;
            diceRolled = true;
            document.getElementById('status').innerText = `تاس شما: ${d1} و ${d2} - مهره خود را انتخاب و جابجا کنید.`;
        }

        function botTurn() {
            currentTurn = 'B';
            diceRolled = false;
            document.getElementById('roll-btn').disabled = true;
            document.getElementById('status').innerText = "نوبت ربات (سیاه) - در حال تاس ریختن...";

            setTimeout(() => {
                let d1 = Math.floor(Math.random() * 6) + 1;
                let d2 = Math.floor(Math.random() * 6) + 1;
                document.getElementById('dice1').innerText = d1;
                document.getElementById('dice2').innerText = d2;
                document.getElementById('status').innerText = `تاس ربات: ${d1} و ${d2} - در حال حرکت...`;

                setTimeout(() => {
                    let blackPoints = Object.keys(boardState).filter(k => boardState[k].color === 'B');
                    if (blackPoints.length > 0) {
                        let randomSource = blackPoints[Math.floor(Math.random() * blackPoints.length)];
                        let targetIndex = Math.min(23, parseInt(randomSource) + d1);

                        boardState[randomSource].count--;
                        if (boardState[randomSource].count === 0) {
                            delete boardState[randomSource];
                        }

                        if (!boardState[targetIndex]) {
                            boardState[targetIndex] = {color: 'B', count: 1};
                        } else {
                            boardState[targetIndex].count++;
                        }
                    }

                    renderBoard();
                    currentTurn = 'W';
                    diceRolled = false;
                    document.getElementById('roll-btn').disabled = false;
                    document.getElementById('status').innerText = "نوبت شماست - تاس بیندازید";
                }, 1200);
            }, 1000);
        }

        document.querySelectorAll('.point').forEach(point => {
            point.addEventListener('click', function() {
                if (currentTurn !== 'W' || !diceRolled) return;

                let index = this.getAttribute('data-index');
                
                if (selectedPoint === null) {
                    if (boardState[index] && boardState[index].color === 'W') {
                        selectedPoint = index;
                        this.style.background = '#f1c40f55';
                    }
                } else {
                    if (selectedPoint !== index) {
                        let color = boardState[selectedPoint].color;
                        boardState[selectedPoint].count--;
                        if (boardState[selectedPoint].count === 0) {
                            delete boardState[selectedPoint];
                        }

                        if (!boardState[index]) {
                            boardState[index] = {color: color, count: 1};
                        } else {
                            boardState[index].count++;
                        }

                        document.querySelectorAll('.point').forEach(p => p.style.background = '');
                        selectedPoint = null;
                        renderBoard();

                        // اتمام حرکت بازیکن و شروع نوبت ربات
                        botTurn();
                        return;
                    }
                    document.querySelectorAll('.point').forEach(p => p.style.background = '');
                    selectedPoint = null;
                    renderBoard();
                }
            });
        });

        renderBoard();
    </script>
</body>
</html>
