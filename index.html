<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حکم کاریز طب</title>
    <style>
        body {
            background-color: #0b6623;
            color: white;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #game-table {
            margin-top: 50px;
            padding: 20px;
            border: 2px dashed #ffd700;
            border-radius: 15px;
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffd700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>بازی حکم کاریز طب</h1>
    <div id="game-table">
        <p>میز بازی آماده است...</p>
        <button onclick="startTest()">تست موتور بازی</button>
    </div>

    <!-- اتصال موتور بازی -->
    <script src="game_engine.js"></script>
    <script>
        function startTest() {
            const myDeck = new Deck();
            myDeck.shuffle();
            alert("دسته کارت ۵۲ تایی بر زده شد! تعداد کارت‌ها: " + myDeck.cards.length);
        }
    </script>
</body>
</html>
