<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تخته نرد حرفه‌ای سه‌بعدی - کاریز طب</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2c1d0c 0%, #0a0502 100%);
            color: #f4d06f;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .status-bar {
            margin-bottom: 8px;
            font-size: 0.95rem;
            background: rgba(40, 20, 5, 0.8);
            border: 1px solid #d4af37;
            padding: 6px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* تخته نرد سه‌بعدی چوبی */
        .game-container {
            width: 96%;
            max-width: 720px;
            background: linear-gradient(135deg, #5c3a21 0%, #3a2211 100%);
            border: 12px solid #211208;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }
        .board-row {
            display: flex;
            justify-content: space-between;
            height: 210px;
        }
        .quadrant {
            display: flex;
            width: 43%;
            justify-content: space-around;
            background: #d2b48c;
            border: 3px inset #5c3a21;
            padding: 0 2px;
            position: relative;
        }
        .bar {
            width: 8%;
            background: #2a180c;
            border: 2px inset #150c06;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            position: relative;
        }
        .point {
            width: 14.28%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        /* مثلث‌های سنتی چوبی تخته نرد */
        .point.top::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 150px solid #8b4513;
            pointer-events: none;
        }
        .point.top.alt::after {
            border-top-color: #f5deb3;
        }
        .point.bottom::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 150px solid #8b4513;
            pointer-events: none;
        }
        .point.bottom.alt::after {
            border-bottom-color: #f5deb3;
        }
        
        /* مهره‌های سه‌بعدی و براق */
        .checker {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 2px 2px 4px rgba(255,255,255,0.4);
            pointer-events: none;
        }
        .checker.white {
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdcdc 50%, #aaaaaa 100%);
            border: 1px solid #777;
        }
        .checker.black {
            background: radial-gradient(circle at 35% 35%, #555555 0%, #222222 60%, #000000 100%);
            border: 1px solid #111;
        }
        .point.top .checker { top: 4px; }
        .point.bottom .checker { bottom: 4px; }

        /* پنل تاس سه‌بعدی وسط صفحه */
        .center-dice-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            pointer-events: none;
        }
        .dice {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffffff 0%, #e1e1e1 100%);
            color: #000;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 2px solid #ccc;
            transition: transform 0.5s ease;
        }
        .dice.rolling {
            transform: rotate(360deg) scale(1.1);
        }

        .controls-panel {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(30, 15, 5, 0.6);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #8b4513;
        }
        button {
            padding: 10px 22px;
            background: linear-gradient(to bottom, #d4af37, #996515);
            border: 1px solid #ffd700;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        button:hover {
            background: linear-gradient(to bottom, #ffd700, #b8860b);
        }
        button:disabled {
            background: #555;
            border-color: #333;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>تخته نرد سنتی و حرفه‌ای</h1>
    <div class="status-bar" id="status">خوش آمدید! برای شروع بازی دکمه تاس را بزنید.</div>
    
    <div class="game-container" id="board">
        <!-- تاس‌های سه‌بعدی وسط صفحه -->
        <div class="center-dice-area">
            <div class="dice" id="dice1">-</div>
            <div class="dice" id="dice2">-</div>
        </div>

        <div class="board-row">
            <div class="quadrant">
                <div class="point top alt" data-index="11"></div>
                <div class="point top" data-index="10"></div>
                <div class="point top alt" data-index="9"></div>
                <div class="point top" data-index="8"></div>
                <div class="point top alt" data-index="7"></div>
                <div class="point top" data-index="6"></div>
            </div>
            <div class="bar" id="bar-top"></div>
            <div class="quadrant">
                <div class="point top alt" data-index="5"></div>
                <div class="point top" data-index="4"></div>
                <div class="point top alt" data-index="3"></div>
                <div class="point top" data-index="2"></div>
                <div class="point top alt" data-index="1"></div>
                <div class="point top" data-index="0"></div>
            </div>
        </div>

        <div class="board-row" style="margin-top: 12px;">
            <div class="quadrant">
                <div class="point bottom" data-index="12"></div>
                <div class="point bottom alt" data-index="13"></div>
                <div class="point bottom" data-index="14"></div>
                <div class="point bottom alt" data-index="15"></div>
                <div class="point bottom" data-index="16"></div>
                <div class="point bottom alt" data-index="17"></div>
            </div>
            <div class="bar" id="bar-bottom"></div>
            <div class="quadrant">
                <div class="point bottom" data-index="18"></div>
                <div class="point bottom alt" data-index="19"></div>
                <div class="point bottom" data-index="20"></div>
                <div class="point bottom alt" data-index="21"></div>
                <div class="point bottom" data-index="22"></div>
                <div class="point bottom alt" data-index="23"></div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <button id="roll-btn" onclick="rollDice()">انداختن تاس</button>
    </div>

    <script>
        // ساختار خانه‌های تخته نرد (۲۴ خانه از ۰ تا ۲۳)
        let board = {};
        function initBoard() {
            board = {};
            for(let i=0; i<24; i++) board[i] = {color: null, count: 0};
            // چیدمان استاندارد تخته نرد
            board[0] = {color: 'B', count: 2};
            board[5] = {color: 'W', count: 5};
            board[7] = {color: 'W', count: 3};
            board[11] = {color: 'B', count: 5};
            board[12] = {color: 'W', count: 5};
            board[16] = {color: 'B', count: 3};
            board[18] = {color: 'B', count: 5};
            board[23] = {color: 'W', count: 2};
        }

        let bar = { W: 0, B: 0 }; // مهره‌های زده شده
        let currentTurn = 'W'; // 'W' = سفید (شما)، 'B' = سیاه (ربات)
        let dice = [];
        let selectedPoint = null;
        let gameActive = true;

        function renderBoard() {
            for(let i=0; i<24; i++) {
                let pEl = document.querySelector(`[data-index="${i}"]`);
                if(!pEl) continue;
                pEl.innerHTML = '';
                let data = board[i];
                if(data && data.count > 0) {
                    for(let j=0; j<data.count; j++) {
                        let ch = document.createElement('div');
                        ch.className = `checker ${data.color === 'W' ? 'white' : 'black'}`;
                        if(pEl.classList.contains('top')) {
                            ch.style.top = (j * 16) + 'px';
                        } else {
                            ch.style.bottom = (j * 16) + 'px';
                        }
                        pEl.appendChild(ch);
                    }
                }
            }

            // نمایش مهره‌های بار (زده شده)
            let barTop = document.getElementById('bar-top');
            let barBot = document.getElementById('bar-bottom');
            barTop.innerHTML = bar.B > 0 ? `<div class="checker black" style="position:relative;"></div><span style="font-size:10px">${bar.B}</span>` : '';
            barBot.innerHTML = bar.W > 0 ? `<div class="checker white" style="position:relative;"></div><span style="font-size:10px">${bar.W}</span>` : '';
        }

        function rollDice() {
            if(!gameActive || dice.length > 0) return;

            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            
            let dEl1 = document.getElementById('dice1');
            let dEl2 = document.getElementById('dice2');
            dEl1.classList.add('rolling');
            dEl2.classList.add('rolling');

            setTimeout(() => {
                dEl1.classList.remove('rolling');
                dEl2.classList.remove('rolling');
                dEl1.innerText = d1;
                dEl2.innerText = d2;

                if(d1 === d2) {
                    dice = [d1, d1, d1, d1]; // تاس جفت چهارتا حرکت
                } else {
                    dice = [d1, d2];
                }

                document.getElementById('status').innerText = `تاس آمد: ${d1} و ${d2} - نوبت بازیکن ${currentTurn === 'W' ? 'سفید (شما)' : 'سیاه (ربات)'}`;
                
                if(currentTurn === 'B') {
                    setTimeout(botMove, 1000);
                }
            }, 500);
        }

        // کلیک بازیکن سفید روی خانه‌ها
        document.querySelectorAll('.point').forEach(point => {
            point.addEventListener('click', function() {
                if(currentTurn !== 'W' || dice.length === 0 || !gameActive) return;

                let index = parseInt(this.getAttribute('data-index'));

                // اگر مهره‌ای در بار داشته باشد اول باید آن را وارد کند
                if(bar.W > 0 && index !== (23 - dice[0]) && index !== (23 - dice[1])) {
                    document.getElementById('status').innerText = "خطا: شما مهره زده شده در بار دارید، باید آن را وارد کنید!";
                    return;
                }

                if(selectedPoint === null) {
                    if(board[index].color === 'W' && board[index].count > 0) {
                        selectedPoint = index;
                        this.style.background = '#f39c1266';
                    }
                } else {
                    let diff = selectedPoint - index; // حرکت سفید رو به جلو (از ۲۳ به سمت ۰)
                    if(dice.includes(diff)) {
                        if(board[index].color === null || board[index].color === 'W' || board[index].count === 1) {
                            // اجرای حرکت
                            board[selectedPoint].count--;
                            if(board[selectedPoint].count === 0) board[selectedPoint].color = null;

                            if(board[index].color === 'B') {
                                // زدن مهره حریف
                                bar.B++;
                                board[index] = {color: 'W', count: 1};
                            } else {
                                if(!board[index].color) board[index].color = 'W';
                                board[index].count++;
                            }

                            // حذف تاس استفاده شده
                            let dIdx = dice.indexOf(diff);
                            dice.splice(dIdx, 1);

                            document.querySelectorAll('.point').forEach(p => p.style.background = '');
                            selectedPoint = null;
                            renderBoard();

                            checkTurnCompletion();
                        } else {
                            document.getElementById('status').innerText = "این خانه بسته است و متعلق به حریف است!";
                        }
                    } else {
                        document.getElementById('status').innerText = "مقدار حرکت با تاس‌های موجود مطابقت ندارد!";
                    }

                    document.querySelectorAll('.point').forEach(p => p.style.background = '');
                    selectedPoint = null;
                }
            });
        });

        function checkTurnCompletion() {
            document.getElementById('dice1').innerText = dice[0] || '-';
            document.getElementById('dice2').innerText = dice[1] || '-';

            if(dice.length === 0) {
                currentTurn = (currentTurn === 'W') ? 'B' : 'W';
                document.getElementById('status').innerText = `نوبت به بازیکن ${currentTurn === 'W' ? 'سفید' : 'سیاه'} منتقل شد.`;
                if(currentTurn === 'B') {
                    setTimeout(rollDice, 1200);
                }
            }
        }

        // هوش مصنوعی اصولی و حرفه‌ای (ربات سیاه)
        function botMove() {
            if(currentTurn !== 'B' || !gameActive) return;

            document.getElementById('status').innerText = "ربات (سیاه) در حال تفکر و بازی...";

            setTimeout(() => {
                while(dice.length > 0) {
                    let d = dice[0];
                    let moved = false;

                    // اگر ربات مهره در بار دارد اول وارد کند
                    if(bar.B > 0) {
                        let target = d - 1;
                        if(board[target].color === null || board[target].color === 'B' || board[target].count === 1) {
                            bar.B--;
                            if(board[target].color === 'W') {
                                bar.W++;
                                board[target] = {color: 'B', count: 1};
                            } else {
                                board[target].color = 'B';
                                board[target].count++;
                            }
                            moved = true;
                        }
                    } else {
                        // پیدا کردن مهره‌های سیاه ربات
                        let blackPoints = [];
                        for(let i=0; i<24; i++) {
                            if(board[i].color === 'B' && board[i].count > 0) blackPoints.push(i);
                        }

                        // مرتب‌سازی برای حرکت اصولی (ترجیحاً زدن مهره سفید یا نزدیک شدن به خانه خود)
                        blackPoints.sort((a,b) => b - a);

                        for(let src of blackPoints) {
                            let target = src + d;
                            if(target < 24) {
                                if(board[target].color === null || board[target].color === 'B' || board[target].count === 1) {
                                    board[src].count--;
                                    if(board[src].count === 0) board[src].color = null;

                                    if(board[target].color === 'W') {
                                        bar.W++;
                                        board[target] = {color: 'B', count: 1};
                                    } else {
                                        board[target].color = 'B';
                                        board[target].count++;
                                    }
                                    moved = true;
                                    break;
                                }
                            }
                        }
                    }

                    if(moved) {
                        dice.shift();
                    } else {
                        // اگر حرکتی مقدور نبود، تاس‌های باقی‌مانده می‌سوزد
                        dice = [];
                    }
                }

                renderBoard();
                document.getElementById('dice1').innerText = '-';
                document.getElementById('dice2').innerText = '-';

                if(gameActive) {
                    currentTurn = 'W';
                    document.getElementById('status').innerText = "نوبت شماست - تاس بیندازید";
                }
            }, 1500);
        }

        // راه‌اندازی اولیه صفحه
        initBoard();
        renderBoard();
    </script>
</body>
</html>
